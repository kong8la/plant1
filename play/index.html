<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0f16'/%3E%3Cpath d='M10 44 L22 20 L34 44 L46 20 L54 36' stroke='%2338bdf8' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<title>PLANT-1 · FM-1 模块化固件</title>
<meta name="theme-color" content="#07090d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Phase Plant 思路的模块化合成器，做成 M-VAVE FM-1 的样子，单文件跑在浏览器里。" />
<style>:root {
  --bg: #07090d;
  --panel: #0d1219;
  --panel2: #111925;
  --panel3: #0a0f16;
  --line: #1c2634;
  --line2: #263343;
  --txt: #dce7f4;
  --mut: #7a8a9e;
  --gen: #38bdf8;
  --gen-d: #0e7490;
  --mod: #a78bfa;
  --mod-d: #6d28d9;
  --fx: #fb923c;
  --fx-d: #c2410c;
  --ok: #4ade80;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
  --sans: ui-sans-serif, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(56, 189, 248, .06), transparent 60%),
    radial-gradient(900px 500px at 90% 110%, rgba(167, 139, 250, .05), transparent 60%),
    var(--bg);
  color: var(--txt);
  font-family: var(--sans);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------- 顶栏 */
.top {
  flex: 0 0 auto;
  height: 62px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #0c1118 0%, #080b10 100%);
  position: relative;
  z-index: 20;
}
.brand { line-height: 1; min-width: 118px; }
.brand b { font-size: 19px; letter-spacing: .16em; font-weight: 700; }
.brand b span { color: var(--gen); }
.brand i { display: block; margin-top: 4px; font-size: 8px; letter-spacing: .2em; color: var(--mut); font-style: normal; }

.preset { display: flex; align-items: center; gap: 5px; position: relative; }
.preset button { font-family: var(--sans); }
.pbtn {
  width: 24px; height: 30px; border-radius: 6px;
  background: var(--panel); color: var(--mut); border: 1px solid var(--line);
  cursor: pointer; font-size: 10px; line-height: 1;
}
.pbtn:hover { color: var(--txt); border-color: var(--line2); }
.pname {
  min-width: 182px; text-align: left; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 4px 12px; color: var(--txt);
}
.pname:hover { border-color: var(--gen-d); }
.pname b { display: block; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.pname i { display: block; font-size: 8px; letter-spacing: .16em; color: var(--mut); font-style: normal; margin-top: 2px; }

.plist {
  position: absolute; top: 42px; left: 26px; width: 260px; max-height: 420px; overflow: auto;
  background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, .6); padding: 5px; z-index: 60; display: none;
}
.plist.open { display: block; }
.plist button {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  width: 100%; background: transparent; border: 0; color: var(--txt);
  padding: 7px 9px; border-radius: 6px; cursor: pointer; font-size: 12px; text-align: left;
}
.plist button:hover { background: #1a2432; }
.plist button.cur { background: #16283a; }
.plist button em { font: 8px var(--mono); color: var(--mut); font-style: normal; letter-spacing: .12em; }

/* TFT 小屏 */
.screen {
  margin-left: auto; width: 252px; flex: 0 0 auto;
  background: #04100a; border: 1px solid #1c3a29; border-radius: 7px;
  padding: 4px 6px 3px; position: relative; overflow: hidden;
  box-shadow: inset 0 0 20px rgba(74, 222, 128, .10), 0 0 0 1px rgba(0, 0, 0, .4);
}
.screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .30) 0 1px, transparent 1px 3px);
  opacity: .55;
}
#scope { display: block; width: 100%; height: 42px; }
.sline { display: flex; justify-content: space-between; font: 9px/1.2 var(--mono); color: #58d889; letter-spacing: .1em; }
.sline .dim { color: #2f7a4e; }

.acts { display: flex; gap: 5px; }
.acts button {
  background: var(--panel); border: 1px solid var(--line); color: var(--mut);
  border-radius: 6px; padding: 7px 9px; font-size: 10px; letter-spacing: .1em;
  cursor: pointer; font-family: var(--sans);
}
.acts button:hover { color: var(--txt); border-color: var(--line2); }
.acts button.hot:hover { color: #fda4af; border-color: #7f1d1d; }
.acts button.go:hover { color: var(--ok); border-color: #14532d; }

/* ---------------------------------------------------------------- 主体 */
main {
  flex: 1 1 auto; min-height: 0;
  display: grid; grid-template-columns: 202px minmax(0, 1fr) 316px;
  grid-template-rows: minmax(0, 1fr);
  gap: 9px; padding: 9px 10px 6px; overflow: hidden;
}
.col { display: flex; flex-direction: column; gap: 7px; min-width: 0; min-height: 0; }
#colMods { overflow-y: auto; overflow-x: hidden; padding-right: 3px; }
#colVoice { min-height: 0; }

.panel {
  background: linear-gradient(180deg, #101823 0%, #0b1118 100%);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 9px 9px;
}
.panel h3 {
  margin: 0 0 7px; font-size: 9px; letter-spacing: .2em; color: var(--mut); font-weight: 600;
  display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden;
}
.panel h3 .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gen); box-shadow: 0 0 6px var(--gen); }
.panel.mods h3 .dot { background: var(--mod); box-shadow: 0 0 6px var(--mod); }
.panel.fxs h3 .dot { background: var(--fx); box-shadow: 0 0 6px var(--fx); }

.knobrow { display: flex; flex-wrap: wrap; gap: 2px 4px; }

/* 旋钮 */
.knob {
  width: 54px; display: flex; flex-direction: column; align-items: center;
  cursor: ns-resize; user-select: none; touch-action: none; padding: 1px 0 2px;
  border-radius: 6px; position: relative;
}
.knob .kcanvas { width: 40px; height: 40px; display: block; }
.klabel { font-size: 8.5px; color: var(--mut); letter-spacing: .04em; margin-top: 1px; white-space: nowrap; }
.kval { font: 8.5px var(--mono); color: #93a6bc; white-space: nowrap; }
.knob:hover .klabel { color: var(--txt); }
.knob.active .kval { color: var(--gen); }
.knob.hasmode .klabel { color: var(--mod); }
.knob.target { background: rgba(167, 139, 250, .12); box-shadow: 0 0 0 1px var(--mod) inset; }

/* 下拉选择 */
.sel {
  width: 100%; margin-top: 2px; background: var(--panel3); color: var(--txt);
  border: 1px solid var(--line); border-radius: 5px; font: 10px var(--sans);
  padding: 3px 4px; cursor: pointer; appearance: none; text-align: center;
}
.sel:hover { border-color: var(--line2); }
.sel:focus { outline: 1px solid var(--gen-d); }

/* 开关 */
.pwr {
  width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line2);
  background: #0a0f16; color: #3d4b5e; cursor: pointer; font-size: 9px; line-height: 1;
  display: grid; place-items: center; transition: all .15s;
}
.pwr.on { color: #041017; background: var(--gen); border-color: var(--gen); box-shadow: 0 0 10px rgba(56, 189, 248, .45); }

/* 发生器卡片 */
.gens { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; min-height: 0; }
.gen {
  background: linear-gradient(170deg, #0f1a26 0%, #0a1018 100%);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px 6px;
  position: relative; min-height: 0;
  display: flex; flex-direction: column; gap: 3px;
}
.gen::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px;
  border-radius: 2px; background: linear-gradient(180deg, var(--gen), transparent);
  opacity: .5;
}
.gen.off { opacity: .45; filter: saturate(.3); }
.gen-h { display: flex; align-items: center; gap: 6px; margin-bottom: 1px; flex: 0 0 auto; }
.gen-h .tag { font: 9px var(--mono); color: var(--gen); letter-spacing: .14em; }
.gen-h .sel { width: auto; flex: 1; margin: 0; }
.gen-h .pwr { flex: 0 0 auto; }
.gen-body { display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto; min-height: 0; }
.gen-prev {
  width: 100%; height: auto; flex: 1 1 54px; min-height: 42px; max-height: 112px;
  background: #060a0f; border: 1px solid #16202c; border-radius: 5px; display: block;
}
.gen-knobs { display: flex; flex-wrap: wrap; gap: 1px 2px; align-content: flex-start; flex: 0 0 auto; }
.gen-foot { display: flex; align-items: center; gap: 6px; margin-top: 1px; flex: 0 0 auto; }
.gen-foot .lbl { font: 8px var(--mono); color: #4a5a6e; letter-spacing: .1em; }
.gen-foot .sel { width: 92px; margin: 0; }

/* 调制器 */
.mod { border: 1px solid var(--line); border-radius: 9px; background: linear-gradient(180deg, #131022 0%, #0b0a13 100%); padding: 5px 6px 4px; }
.mod-h { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
.mod-h .tag { font: 8.5px var(--mono); color: var(--mod); letter-spacing: .12em; cursor: grab; padding: 2px 5px; border: 1px solid #3b2a63; border-radius: 4px; background: #1a1230; }
.mod-h .tag:active { cursor: grabbing; }
.mod-h .tag:hover { background: #241840; }
.mod-h .nm { font-size: 10px; color: #c3b4ea; flex: 1; }
.mod-h .pwr { width: 18px; height: 18px; font-size: 8px; }
.mod canvas.ed { display: block; width: 100%; height: 36px; background: #08060f; border: 1px solid #221a38; border-radius: 5px; touch-action: none; }
.mod .knobrow { gap: 0 1px; }
.mod .knob { width: 40px; }
.mod .knob .kcanvas { width: 30px; height: 30px; }
.mod .klabel { font-size: 7.5px; }
.mod .kval { font-size: 7.5px; }

/* 调制矩阵 */
.panel.mat { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 96px; }
.panel.mat h3 { flex: 0 0 auto; }
.matrix { display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow: auto; padding-right: 2px; }
.panel.mat .matrix { flex: 1 1 auto; max-height: none; }
.mitem { background: #0c0913; border: 1px solid #1d1730; border-radius: 6px; padding: 2px 4px 1px; }
.mrow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px; font-size: 9.5px; }
.mrow .src { font: 7.5px var(--mono); letter-spacing: .06em; padding: 1px 4px; border-radius: 3px; }
.mrow .tgt { color: #b9c6d8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .del { background: none; border: 0; color: #5b4a6e; cursor: pointer; font-size: 11px; padding: 0 2px; line-height: 1; }
.mrow .del:hover { color: #f87171; }
.mslider { display: flex; align-items: center; gap: 4px; }
.mslider input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: #a78bfa; height: 11px; }
.mslider .amt { font: 7.5px var(--mono); color: var(--mut); width: 30px; text-align: right; flex: 0 0 auto; }
.mempty { font-size: 9.5px; color: #4d5a6b; padding: 8px 4px; line-height: 1.6; }
.srcchips { display: flex; flex-wrap: wrap; gap: 3px; margin: 0 0 5px; }
.chip {
  font: 8px var(--mono); letter-spacing: .06em; color: #b9a6e8;
  background: #1a1230; border: 1px solid #3b2a63; border-radius: 4px;
  padding: 1px 5px; cursor: grab; user-select: none;
}
.chip:hover { background: #241840; color: #ddd0ff; }
.chip:active { cursor: grabbing; }

/* 效果 */
.fxrow { flex: 0 0 auto; padding: 0 10px 6px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
.fx { background: linear-gradient(180deg, #1a1209 0%, #0d0c0a 100%); border: 1px solid #2a2015; border-radius: 9px; padding: 6px 7px 5px; }
.fx.off { opacity: .45; filter: saturate(.25); }
.fx-h { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
.fx-h .tag { font: 8.5px var(--mono); color: var(--fx); letter-spacing: .1em; }
.fx-h .sel { margin: 0; width: auto; flex: 1; font-size: 9px; }
.fx .knobrow { gap: 0 1px; }
.fx .knob { width: 44px; }
.fx .knob .kcanvas { width: 30px; height: 30px; }
.fx .klabel { font-size: 7.5px; }
.fx .kval { font-size: 7.5px; }
.fxrow { align-items: stretch; }
.fx { display: flex; flex-direction: column; }
.master { background: linear-gradient(180deg, #0c1a12 0%, #080d0b 100%); border-color: #173225; }
.master .tag { color: var(--ok); }
.meter { height: 5px; background: #0a1410; border-radius: 3px; overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22c55e, #eab308 70%, #ef4444); transition: width .06s linear; }

/* 键盘 */
.keys { flex: 0 0 auto; padding: 5px 10px 7px; border-top: 1px solid var(--line); background: linear-gradient(180deg, #080b10, #05070a); }
.kwrap { display: flex; align-items: stretch; gap: 8px; }
.kbd { position: relative; height: 82px; flex: 1 1 auto; min-width: 0; }
.wkey {
  position: absolute; top: 0; bottom: 0; border-radius: 0 0 5px 5px;
  background: linear-gradient(180deg, #e7eef7 0%, #b8c6d8 78%, #9aabc0 100%);
  border: 1px solid #0a0e14; border-top: 0; cursor: pointer;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px;
  font: 8px var(--mono); color: #6b7a8c; user-select: none;
}
.wkey:hover { background: linear-gradient(180deg, #f6fbff 0%, #c7d5e6 100%); }
.wkey.on { background: linear-gradient(180deg, #a5f3fc 0%, #22d3ee 85%, #0891b2 100%); color: #06222b; }
.bkey {
  position: absolute; top: 0; height: 58%; border-radius: 0 0 4px 4px;
  background: linear-gradient(180deg, #2a3646 0%, #131a24 60%, #0b1118 100%);
  border: 1px solid #05080c; cursor: pointer; z-index: 3;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px;
  font: 7px var(--mono); color: #56667a; user-select: none;
}
.bkey:hover { background: linear-gradient(180deg, #3a4a5e 0%, #1b2430 100%); }
.bkey.on { background: linear-gradient(180deg, #67e8f9 0%, #06b6d4 70%, #0e7490 100%); color: #04212a; }
.kctrl { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.kctrl button { background: var(--panel); border: 1px solid var(--line); color: var(--mut); border-radius: 5px; height: 21px; font: 9px var(--mono); cursor: pointer; padding: 0 8px; }
.kctrl button:hover { color: var(--txt); border-color: var(--line2); }
.khint { font: 8px var(--mono); color: #3f4d5f; letter-spacing: .06em; line-height: 1.5; margin-top: 4px; }

/* 提示 */
.toast {
  position: fixed; left: 50%; bottom: 132px; transform: translate(-50%, 8px);
  background: #131c28; border: 1px solid #2b3b4f; color: #cfe0f2;
  padding: 7px 13px; border-radius: 8px; font-size: 11px; letter-spacing: .04em;
  opacity: 0; pointer-events: none; transition: all .22s; z-index: 90;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.dropmod {
  position: fixed; z-index: 95; pointer-events: none; display: none;
  background: #241840; border: 1px solid #6d28d9; color: #ddd0ff;
  padding: 3px 9px; border-radius: 20px; font: 10px var(--mono); letter-spacing: .1em;
  transform: translate(-50%, -50%);
}

/* 滚动条 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #1c2836; border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 1300px) {
  .knob { width: 46px; }
  .knob .kcanvas { width: 34px; height: 34px; }
  .gen-knobs .knob { width: 44px; }
  .gen-knobs .knob .kcanvas { width: 33px; height: 33px; }
  .mod .knob { width: 34px; }
  .mod .knob .kcanvas { width: 26px; height: 26px; }
  .fx .knob { width: 38px; }
  .fx .knob .kcanvas { width: 26px; height: 26px; }
  .fx .klabel, .fx .kval { font-size: 7px; }
}

@media (max-width: 1280px) {
  main { grid-template-columns: 176px minmax(0, 1fr) 286px; }
  .screen { width: 210px; }
  .brand i { display: none; }
}
@media (max-width: 1080px) {
  body { overflow: auto; }
  main { grid-template-columns: 1fr; }
  .fxrow { grid-template-columns: repeat(3, 1fr); }
  .gens { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>PLANT<span>-1</span></b><i>FM-1 MODULAR FIRMWARE</i></div>
  <div class="preset">
    <button class="pbtn" id="pPrev" title="上一个音色">&#9664;</button>
    <button class="pname" id="pName"><b id="presetName">初始化</b><i id="presetEn">INIT</i></button>
    <div class="plist" id="presetList"></div>
    <button class="pbtn" id="pNext" title="下一个音色">&#9654;</button>
  </div>
  <div class="screen">
    <canvas id="scope" width="500" height="84"></canvas>
    <div class="sline"><span id="sPreset">INIT</span><span id="sVoices" class="dim">0 V</span></div>
  </div>
  <div class="acts">
    <button data-act="init" title="初始化音色">INIT</button>
    <button data-act="rand" title="随机生成音色">随机</button>
    <button data-act="audition" title="试听当前音色">试听</button>
    <button data-act="save" title="导出音色 JSON">导出</button>
    <button data-act="load" title="导入音色 JSON">导入</button>
    <button data-act="flash" class="go" title="写入 FM-1（模拟）">FLASH</button>
    <button data-act="panic" class="hot" title="全部静音">静音</button>
  </div>
  <input id="fileIn" type="file" accept=".json,application/json" hidden />
</header>

<main id="main">
  <section class="col" id="colVoice"></section>
  <section class="gens" id="colGens"></section>
  <section class="col" id="colMods"></section>
</main>

<section class="fxrow" id="fxrow"></section>

<footer class="keys">
  <div class="kwrap">
    <div class="kctrl">
      <button id="octDown" title="降低八度">&#9664; 八度</button>
      <button id="octUp" title="升高八度">八度 &#9654;</button>
      <button id="holdBtn" title="保持音">保持 OFF</button>
    </div>
    <div class="kbd" id="kbd"></div>
  </div>
  <div class="khint" id="khint">电脑键盘 Z–M / Q–U 演奏 · &#8593;&#8595; 换八度 · 把调制器标签（ENV1 / LFO1 …）拖到任意旋钮上即可建立调制 · 双击旋钮复位 · 右键旋钮清除该参数调制</div>
</footer>

<div class="toast" id="toast"></div>
<div class="dropmod" id="dropMod"></div>

<script id="engine-src" type="text/plain">/* ============================================================================
 * PLANT-1  ·  Phase-Plant 风格模块化合成器引擎（M-VAVE FM-1 固件模拟）
 * ----------------------------------------------------------------------------
 * 纯 JS DSP，不碰 DOM，可同时跑在 AudioWorklet 和 Node 测试里。
 * 结构：4 个发生器槽（模拟/波表/FM/噪声）→ 各自滤波 → 声部总线 → 全局滤波
 *       → 5 个效果槽 → 主输出。调制矩阵把 8 个调制源连到任意浮点参数上。
 * ==========================================================================*/
(function (root) {
  'use strict';

  var TAU = Math.PI * 2;
  var CHUNK = 16;          // 控制率：每 16 个采样更新一次调制/滤波系数
  var TSIZE = 1024;        // 波表长度
  var MASK = TSIZE - 1;

  /* ------------------------------------------------------------------ 参数 */
  var P = {};
  var NSLOT = 0;

  function D(id, min, max, def, o) {
    o = o || {};
    var kind = o.kind || 'float';
    var d = {
      id: id, min: min, max: max, def: def,
      curve: o.curve || 'lin',
      kind: kind,
      label: o.label || id,
      en: o.en || id,
      unit: o.unit || '',
      values: o.values || null,
      mod: kind === 'float' && o.mod !== false,
      slot: -1
    };
    if (d.mod) d.slot = NSLOT++;
    P[id] = d;
    return d;
  }

  function toNorm(d, v) {
    if (d.curve === 'log') {
      v = Math.max(d.min, Math.min(d.max, v));
      return Math.log(v / d.min) / Math.log(d.max / d.min);
    }

<script>/* ============================================================================
 * PLANT-1 界面层：三栏模块化面板、旋钮、拖拽调制、27 键键盘、MIDI
 * ==========================================================================*/
(function () {
  'use strict';

  var engineSrc = document.getElementById('engine-src').textContent;
  var presetSrc = document.getElementById('presets-src').textContent;
  new Function(engineSrc)();
  new Function(presetSrc)();
  var PLANT = window.PLANT;
  var PRESETS = window.PLANT_PRESETS.PRESETS;
  var P = PLANT.PARAMS;

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
  }

  var S = {
    patch: PLANT.defaults(), mods: [], preset: 0, octave: 0,
    ctx: null, node: null, analyser: null, ready: false, starting: null,
    pending: {}, raf: 0, hold: false, held: {}, sustained: {}, voices: 0, meter: 0,
    device: null,
    meterBar: null
  };
  S.patch.mods = S.mods;

  var KNOBS = {}, SELECTS = {}, REFRESH = [];

  /* ------------------------------------------------------------ 数值格式 */
  function fmtVal(id) {
    var d = P[id], v = S.patch[id];
    if (d.kind === 'enum') return (d.values && d.values[v]) || '';
    if (d.unit === 'Hz') return v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : Math.round(v);
    if (d.unit === 's') return v < 1 ? Math.round(v * 1000) + 'ms' : v.toFixed(2) + 's';
    if (d.unit === '¢') return Math.round(v) + '¢';
    if (d.unit === 'st') return (v > 0 ? '+' : '') + v.toFixed(1);
    if (d.kind === 'int') return String(Math.round(v));
    if (d.max - d.min <= 2) return v.toFixed(2);
    if (d.max <= 1.5) return Math.round(v * 100) + '%';
    return v.toFixed(1);
  }
  function valueFromNorm(d, n) {
    var v = PLANT.fromNorm(d, clamp(n, 0, 1));
    if (d.kind === 'int' || d.kind === 'enum') v = Math.round(v);
    return clamp(v, d.min, d.max);
  }

  /* ------------------------------------------------------------ 参数写回 */
  function setParam(id, v, silent) {
    var d = P[id];
    if (!d) return;
    v = (d.kind === 'enum' || d.kind === 'int') ? Math.round(v) : v;
    v = clamp(v, d.min, d.max);
    S.patch[id] = v;
    if (!silent) { queueParam(id, v); saveSoon(); }
    refreshParam(id);
  }
  function queueParam(id, v) {
    S.pending[id] = v;
    if (!S.raf) S.raf = requestAnimationFrame(flushParams);
  }
  function flushParams() {
    S.raf = 0;
    if (!S.node) { S.pending = {}; return; }
    for (var id in S.pending) post({ type: 'param', id: id, v: S.pending[id] });
    S.pending = {};
  }
  function post(msg) { if (S.node) S.node.port.postMessage(msg); }
  function sendPatch() {
    if (!S.node) return;
    S.patch.mods = S.mods;
    post({ type: 'patch', patch: S.patch });
  }
  function sendMods() {
    S.patch.mods = S.mods;
    if (S.node) post({ type: 'mods', mods: S.mods });
    refreshAllKnobs();
  }

  /* -------------------------------------------------------------- 音频 */
  var PROC = [
    'class PlantProcessor extends AudioWorkletProcessor {',
    '  constructor() {',
    '    super();',
    '    this.e = new PLANT.Engine(sampleRate);',
    '    this.n = 0;',
    '    this.port.onmessage = (ev) => {',
    '      const m = ev.data;',
    '      try {',
    '        if (m.type === "patch") this.e.setPatch(m.patch);',
    '        else if (m.type === "param") this.e.setParam(m.id, m.v);',
    '        else if (m.type === "mods") this.e.setMods(m.mods);',
    '        else if (m.type === "note") { if (m.on) this.e.noteOn(m.midi, m.vel); else this.e.noteOff(m.midi); }',
    '        else if (m.type === "bend") this.e.setBend(m.v);',
    '        else if (m.type === "mw") this.e.setModWheel(m.v);',
    '        else if (m.type === "at") this.e.setAftertouch(m.v);',
    '        else if (m.type === "panic") this.e.allOff();',
    '      } catch (err) { }',
    '    };',
    '  }',
    '  process(inputs, outputs) {',
    '    const out = outputs[0];',
    '    if (out && out.length) {',
    '      try { this.e.process(out[0], out[1] || out[0], out[0].length); }',
    '      catch (err) { for (let c = 0; c < out.length; c++) out[c].fill(0); }',
    '    }',
    '    if ((this.n++ & 7) === 0) this.port.postMessage({ type: "stat", voices: this.e.activeVoices || 0, meter: this.e.meter || 0 });',
    '    return true;',
    '  }',
    '}',
    'registerProcessor("plant1", PlantProcessor);'
  ].join('\n');

  function applyMsg(eng, m) {
    try {
      if (m.type === 'patch') eng.setPatch(m.patch);
      else if (m.type === 'param') eng.setParam(m.id, m.v);
      else if (m.type === 'mods') eng.setMods(m.mods);
      else if (m.type === 'note') { if (m.on) eng.noteOn(m.midi, m.vel); else eng.noteOff(m.midi); }
      else if (m.type === 'bend') eng.setBend(m.v);
      else if (m.type === 'mw') eng.setModWheel(m.v);
      else if (m.type === 'at') eng.setAftertouch(m.v);
      else if (m.type === 'panic') eng.allOff();
    } catch (err) { }
  }

  /* file:// 下浏览器禁止 blob 加载 AudioWorklet，退回复用同一引擎的 ScriptProcessor */
  function makeLocalNode(ctx) {
    var sp = ctx.createScriptProcessor(512, 0, 2);
    var eng = new PLANT.Engine(ctx.sampleRate);
    var api = {
      local: true,
      port: { postMessage: function (m) { applyMsg(eng, m); } },
      connect: function (dst) { sp.connect(dst); },
      disconnect: function () { sp.disconnect(); }
    };
    sp.onaudioprocess = function (e) {
      var L = e.outputBuffer.getChannelData(0);
      var R = e.outputBuffer.getChannelData(1);
      try { eng.process(L, R, L.length); } catch (err) { L.fill(0); R.fill(0); }
      S.voices = eng.activeVoices || 0;
      S.meter = eng.meter || 0;
    };
    return api;
  }

  function ensureAudio() {
    if (S.ctx) { if (S.ctx.state === 'suspended') S.ctx.resume(); return S.starting || Promise.resolve(); }
    if (S.starting) return S.starting;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { toast('这个浏览器不支持 Web Audio'); return Promise.resolve(); }
    S.starting = (async function () {
      var ctx = new AC({ latencyHint: 'interactive' });
      var node = null;
      if (ctx.audioWorklet && location.protocol !== 'file:') {
        try {
          var url = URL.createObjectURL(new Blob([engineSrc + '\n' + PROC], { type: 'text/javascript' }));
          await ctx.audioWorklet.addModule(url);
          URL.revokeObjectURL(url);
          node = new AudioWorkletNode(ctx, 'plant1', {
            numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2]
          });
          node.port.onmessage = function (ev) {
            var m = ev.data;
            if (m.type === 'stat') { S.voices = m.voices; S.meter = m.meter; }
          };
        } catch (err) { node = null; }
      }
      if (!node) node = makeLocalNode(ctx);
      var an = ctx.createAnalyser();
      an.fftSize = 1024;
      an.smoothingTimeConstant = 0.25;
      node.connect(an);
      an.connect(ctx.destination);
      S.ctx = ctx; S.node = node; S.analyser = an; S.ready = true;
      sendPatch();
      for (var m2 in S.held) post({ type: 'note', on: 1, midi: +m2, vel: 0.85 });
      if (ctx.state === 'suspended') ctx.resume();
    })();
    return S.starting;
  }

  /* -------------------------------------------------------------- 提示 */
  var toastT = 0;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  /* -------------------------------------------------------------- 旋钮 */
  var ARC0 = -135, ARC1 = 135;
  function arcPath(c, cx, cy, r, a0, a1) {
    c.beginPath();
    c.arc(cx, cy, r, (a0 - 90) * Math.PI / 180, (a1 - 90) * Math.PI / 180, false);
    c.stroke();
  }
  var SRC_COL = { env1: '#a78bfa', env2: '#a78bfa', env3: '#a78bfa', lfo1: '#c084fc', lfo2: '#c084fc', chaos: '#f472b6', macro: '#fbbf24', vel: '#38bdf8', key: '#38bdf8', mw: '#38bdf8', at: '#38bdf8', rnd: '#f472b6' };

  function makeKnob(host, id, opts) {
    opts = opts || {};
    var d = P[id];
    var wrap = el('div', 'knob');
    wrap.dataset.param = id;
    var cv = el('canvas', 'kcanvas');
    cv.width = 80; cv.height = 80;
    var lb = el('div', 'klabel', opts.label || d.label);
    var vv = el('div', 'kval');
    wrap.appendChild(cv); wrap.appendChild(lb); wrap.appendChild(vv);
    host.appendChild(wrap);
    var g = cv.getContext('2d');
    var color = opts.color || '#38bdf8';

    var inst = { el: wrap, id: id };
    inst.update = function () {
      if (!cv.isConnected) return;
      var v = S.patch[id];
      var n = PLANT.toNorm(d, v);
      var list = S.mods.filter(function (m) { return m.target === id; });
      g.clearRect(0, 0, 80, 80);
      g.lineCap = 'round';
      g.strokeStyle = '#1b2634'; g.lineWidth = 6;
      arcPath(g, 40, 40, 29, ARC0, ARC1);
      list.forEach(function (m, i) {
        var col = SRC_COL[m.src] || '#a78bfa';
        var a0 = ARC0 + 270 * n;
        var a1 = ARC0 + 270 * clamp(n + m.amt, 0, 1);
        g.strokeStyle = col; g.globalAlpha = 0.85; g.lineWidth = 3;
        arcPath(g, 40, 40, 21 + i * 4, Math.min(a0, a1), Math.max(a0, a1));
        g.globalAlpha = 1;
      });
      g.strokeStyle = color;
      g.lineWidth = 6;
      if (n > 0.004) arcPath(g, 40, 40, 29, ARC0, ARC0 + 270 * n);
      g.fillStyle = '#0b1119';
      g.beginPath(); g.arc(40, 40, 18, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#243141'; g.lineWidth = 1.5;
      g.beginPath(); g.arc(40, 40, 18, 0, Math.PI * 2); g.stroke();
      var ang = (ARC0 + 270 * n - 90) * Math.PI / 180;
      g.strokeStyle = '#dce7f4'; g.lineWidth = 2.4; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(40 + Math.cos(ang) * 6, 40 + Math.sin(ang) * 6);
      g.lineTo(40 + Math.cos(ang) * 15, 40 + Math.sin(ang) * 15);
      g.stroke();
      vv.textContent = fmtVal(id);
      wrap.classList.toggle('hasmode', list.length > 0);
    };

    var drag = null;
    wrap.addEventListener('pointerdown', function (e) {
      if (e.button === 2) return;
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      var mod = S.mods.find(function (m) { return m.target === id; });
      drag = {
        x: e.clientX, y: e.clientY,
        n: PLANT.toNorm(d, S.patch[id]),
        mod: (e.altKey && mod) ? mod : null,
        m0: mod ? mod.amt : 0
      };
      wrap.classList.add('active');
    });
    wrap.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dy = drag.y - e.clientY, dx = e.clientX - drag.x;
      var delta = (dy + dx * 0.45) * (e.shiftKey ? 0.2 : 1) / 165;
      if (drag.mod) {
        drag.mod.amt = clamp(drag.m0 + delta * 2, -1, 1);
        sendMods();
        renderMatrix();
      } else {
        setParam(id, valueFromNorm(d, drag.n + delta));
      }
    });
    wrap.addEventListener('pointerup', function (e) {
      if (!drag) return;
      drag = null;
      wrap.classList.remove('active');
      try { wrap.releasePointerCapture(e.pointerId); } catch (err) { }
      saveSoon();
    });
    wrap.addEventListener('dblclick', function () {
      setParam(id, d.def);
      toast(d.label + ' 已复位');
    });
    wrap.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      var had = S.mods.some(function (m) { return m.target === id; });
      if (!had) return;
      S.mods = S.mods.filter(function (m) { return m.target !== id; });
      sendMods(); renderMatrix();
      toast('已清除 ' + d.label + ' 的调制');
    });

    inst.update();
    (KNOBS[id] = KNOBS[id] || []).push(inst);
    return inst;
  }

  function refreshParam(id) {
    var list = KNOBS[id];
    if (list) for (var i = 0; i < list.length; i++) list[i].update();
    var sels = SELECTS[id];
    if (sels) for (var j = 0; j < sels.length; j++) sels[j].value = String(S.patch[id]);
    for (var k = 0; k < REFRESH.length; k++) REFRESH[k](id);
  }
  function pruneControls() {
    for (var id in KNOBS) {
      KNOBS[id] = KNOBS[id].filter(function (k) { return k.el.isConnected; });
      if (!KNOBS[id].length) delete KNOBS[id];
    }
    for (var s in SELECTS) {
      SELECTS[s] = SELECTS[s].filter(function (e) { return e.isConnected; });
      if (!SELECTS[s].length) delete SELECTS[s];
    }
  }

  function loadLocal() {

  /* --- 发生器 --- */
  var GEN_KNOBS = {
    0: ['level', 'pan', 'tune', 'pwm', 'cut', 'res'],
    1: ['level', 'pan', 'tune', 'morph', 'cut', 'res'],
    2: ['level', 'pan', 'tune', 'ratio', 'index', 'fb', 'cut', 'res'],

  };
  var GEN_EXTRA_SELECT = { 0: 'wave', 1: 'table', 2: null, 3: null };
  var GEN_LABEL = {
    level: '电平', pan: '声像', tune: '音高', pwm: '脉宽', cut: '截止', res: '共振',
    morph: '形变', ratio: '比率', index: '指数', fb: '反馈', color: '色温', wave: '波形', table: '波表'
  };

  function drawGenPreview(cv, g) {
    if (!cv.isConnected) return;
    var dpr = window.devicePixelRatio || 1;
    var w = Math.max(40, cv.clientWidth || 74);
    var h = Math.max(30, cv.clientHeight || 44);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);

    c.strokeStyle = '#0f1b25'; c.lineWidth = 1;
    for (var k = 1; k < 4; k++) {
      var gy = h * k / 4;
      c.beginPath(); c.moveTo(0, gy); c.lineTo(w, gy); c.stroke();
    }

    var on = Math.round(S.patch['gen' + g + '.on']);
    if (!on) {
      c.strokeStyle = '#16232f'; c.lineWidth = 1.3; c.setLineDash([3, 5]);
      c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
      c.setLineDash([]);
      c.font = '600 10px ui-monospace, monospace';
      c.fillStyle = '#1d2f40';
      c.textAlign = 'right';
      c.fillText('OFF', w - 8, h / 2 - 6);
      return;
    }

    var type = Math.round(S.patch['gen' + g + '.type']);
    var N = Math.max(140, Math.round(w * 1.4));
    var cycles = 2;
    var amp = h * 0.40;
    var pts = new Array(N + 1);
    var i, t, ph, v;
    for (i = 0; i <= N; i++) {
      t = i / N * cycles;
      ph = t % 1;
      v = 0;
      if (type === 0) {
        var wv = Math.round(S.patch['gen' + g + '.wave']);
        var pw = S.patch['gen' + g + '.pwm'];
        if (wv === 0) v = 2 * ph - 1;
        else if (wv === 1) v = ph < 0.5 ? 1 : -1;
        else if (wv === 2) v = ph < pw ? 1 : -1;
        else v = Math.sin(ph * Math.PI * 2);
      } else if (type === 1) {
        var mo = S.patch['gen' + g + '.morph'];
        v = Math.sin(ph * Math.PI * 2) * (1 - mo) + (2 * ph - 1) * mo;
      } else if (type === 2) {
        var idx = S.patch['gen' + g + '.index'];
        var ratio = S.patch['gen' + g + '.ratio'];
        v = Math.sin(ph * Math.PI * 2 + idx * Math.sin(ph * Math.PI * 2 * ratio)) * 0.85;
      } else {
        var seed = (i * 2654435761) % 4294967296 / 4294967296;
        v = (seed * 2 - 1) * 0.7 + (i % 2 ? 0.12 : -0.12);
      }
      pts[i] = { x: i / N * w, y: h / 2 - v * amp };
    }

    var grd = c.createLinearGradient(0, h / 2 - amp, 0, h / 2 + amp);
    grd.addColorStop(0, 'rgba(56,189,248,.26)');
    grd.addColorStop(1, 'rgba(56,189,248,.02)');
    c.beginPath();
    c.moveTo(0, h / 2);
    for (i = 0; i <= N; i++) c.lineTo(pts[i].x, pts[i].y);
    c.lineTo(w, h / 2);
    c.closePath();
    c.fillStyle = grd;
    c.fill();

    c.beginPath();
    for (i = 0; i <= N; i++) {
      if (i === 0) c.moveTo(pts[i].x, pts[i].y); else c.lineTo(pts[i].x, pts[i].y);
    }
    c.strokeStyle = '#38bdf8';
    c.lineWidth = 1.5;
    c.lineJoin = 'round';
    c.stroke();
  }

  function genIds(g) {
    return ['on', 'type', 'level', 'pan', 'tune', 'cut', 'res', 'ftype', 'wave', 'pwm', 'table', 'morph', 'ratio', 'index', 'fb', 'color']
      .map(function (k) { return 'gen' + g + '.' + k; });
  }

  function buildGens() {
    var host = $('colGens');
    host.innerHTML = '';
    for (var g = 0; g < 4; g++) buildGen(g, host);

      if (!id || id.indexOf('gen') === 0) {

  function buildGen(g, host) {

    for (var i = 0; i < ids.length; i++) { delete KNOBS[ids[i]]; delete SELECTS[ids[i]]; }

    var card = el('div', 'gen' + (Math.round(S.patch['gen' + g + '.on']) ? '' : ' off'));

    });

    var foot = el('div', 'gen-foot');

      var extraWrap = el('div');

    foot.appendChild(el('span', 'lbl', 'FILTER'));

      fsel.appendChild(o);
    });
    fsel.value = String(Math.round(S.patch['gen' + g + '.ftype']));
    fsel.addEventListener('change', function () { setParam('gen' + g + '.ftype', +fsel.value); });
    foot.appendChild(fsel);
    card.appendChild(foot);

    host.appendChild(card);

    var type = Math.round(S.patch['gen' + g + '.type']);
    GEN_KNOBS[type].forEach(function (k2) {
      makeKnob(knobs, 'gen' + g + '.' + k2, { label: GEN_LABEL[k2] || k2 });
    });
    requestAnimationFrame(function () { drawGenPreview(pv, g); });
  }

  function rebuildGenCard(g) {
    var host = $('colGens');
    var old = host.children[g];
    if (!old) return;
    var frag = document.createDocumentFragment();
    buildGen(g, frag);
    host.replaceChild(frag.firstChild, old);
  }

  /* --- 调制器 --- */
  function envLayout(e, W, H) {
    var pad = 5;
    var a = S.patch['env' + e + '.a'], d = S.patch['env' + e + '.d'];
    var r = S.patch['env' + e + '.r'], s = S.patch['env' + e + '.s'];
    var usable = W - pad * 2;
    var total = Math.max(0.02, a + d + r + 0.1);
    var wa = Math.max(7, usable * a / total);
    var wd = Math.max(7, usable * d / total);
    var ws = usable * 0.16;
    var wr = Math.max(7, usable * r / total);
    var k = usable / (wa + wd + ws + wr);
    wa *= k; wd *= k; ws *= k; wr *= k;
    var x0 = pad + 1, x1 = x0 + wa, x2 = x1 + wd, x3 = x2 + ws, x4 = x3 + wr;
    var y0 = pad + 2, yb = H - pad, yS = pad + (H - pad * 2 - 2) * (1 - s);
    return { x0: x0, x1: x1, x2: x2, x3: x3, x4: x4, y0: y0, yS: yS, yb: yb };
  }

  function drawEnv(cv, e) {
    if (!cv.isConnected) return;
    var w = cv.clientWidth || 280, h = cv.clientHeight || 30;
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    var L = envLayout(e, w, h);
    c.strokeStyle = '#241a3d'; c.lineWidth = 1;
    for (var i = 1; i < 4; i++) {
      var x = L.x0 + (L.x4 - L.x0) * i / 4;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke();
    }
    c.beginPath();
    c.moveTo(L.x0, L.yb);
    c.lineTo(L.x1, L.y0);
    c.lineTo(L.x2, L.yS);
    c.lineTo(L.x3, L.yS);
    c.lineTo(L.x4, L.yb);
    c.strokeStyle = '#a78bfa'; c.lineWidth = 1.8; c.lineJoin = 'round'; c.stroke();
    var grd = c.createLinearGradient(0, L.y0, 0, L.yb);
    grd.addColorStop(0, 'rgba(167,139,250,.30)');
    grd.addColorStop(1, 'rgba(167,139,250,.02)');
    c.lineTo(L.x4, L.yb); c.lineTo(L.x0, L.yb); c.closePath();
    c.fillStyle = grd; c.fill();
    [[L.x1, L.y0], [L.x2, L.yS], [L.x3, L.yS]].forEach(function (pt) {
      c.beginPath(); c.arc(pt[0], pt[1], 3.2, 0, Math.PI * 2);
      c.fillStyle = '#c4b5fd'; c.fill();
    });
  }

  function bindEnvDrag(cv, e) {
    var drag = null;
    cv.addEventListener('pointerdown', function (ev) {
      var r = cv.getBoundingClientRect();
      var x = ev.clientX - r.left, y = ev.clientY - r.top;
      var L = envLayout(e, r.width, r.height);
      var cands = [
        { t: 'a', x: L.x1, y: L.y0 }, { t: 'ds', x: L.x2, y: L.yS }, { t: 'r', x: L.x3, y: L.yS }
      ];
      var best = null, bd = 24;
      cands.forEach(function (c) {
        var dd = Math.sqrt((c.x - x) * (c.x - x) + (c.y - y) * (c.y - y));
        if (dd < bd) { bd = dd; best = c; }
      });
      if (!best) return;
      ev.preventDefault();
      cv.setPointerCapture(ev.pointerId);
      drag = {
        t: best.t, x0: x, y0: y,
        a: S.patch['env' + e + '.a'], d: S.patch['env' + e + '.d'],
        r: S.patch['env' + e + '.r'], s: S.patch['env' + e + '.s']
      };
    });
    cv.addEventListener('pointermove', function (ev) {
      if (!drag) return;
      var r = cv.getBoundingClientRect();
      var dx = ev.clientX - r.left - drag.x0;
      var dy = ev.clientY - r.top - drag.y0;
      var k = Math.exp(dx / 55);
      if (drag.t === 'a') setParam('env' + e + '.a', clamp(drag.a * k, 0.001, 8));
      else if (drag.t === 'r') setParam('env' + e + '.r', clamp(drag.r * k, 0.002, 10));
      else if (drag.t === 'ds') {
        setParam('env' + e + '.d', clamp(drag.d * k, 0.002, 8));
        setParam('env' + e + '.s', clamp(drag.s - dy / (r.height - 8), 0, 1));
      }
    });
    cv.addEventListener('pointerup', function (ev) {
      drag = null;
      try { cv.releasePointerCapture(ev.pointerId); } catch (err) { }
    });
  }

  function buildEnv(e, host) {
    var card = el('div', 'mod');
    var h = el('div', 'mod-h');
    var tag = el('span', 'tag', 'ENV' + (e + 1));

    card.appendChild(cv);

      makeKnob(row, 'env' + e + '.' + k, { color: '#a78bfa', label: { a: '起音', d: '衰减', s: '延持', r: '释放' }[k] });
    });

    });
    requestAnimationFrame(function () { drawEnv(cv, e); });
  }

  var lfoPhase = [0, 0];
  function lfoRate(l) {
    var beat = 60 / S.patch['tempo'];
    var divs = [32, 16, 8, 2, 1, 0.5, 0.25, 0.125];
    return Math.round(S.patch['lfo' + l + '.sync']) ? 1 / (beat * divs[Math.round(S.patch['lfo' + l + '.div'])]) : S.patch['lfo' + l + '.rate'];
  }
  function lfoShape(l, ph) {
    var s = Math.round(S.patch['lfo' + l + '.shape']);
    switch (s) {
      case 0: return Math.sin(ph * Math.PI * 2);
      case 1: return 1 - 4 * Math.abs(ph - 0.5);
      case 2: return ph * 2 - 1;
      case 3: return 1 - ph * 2;
      case 4: return ph < 0.5 ? 1 : -1;
      case 5: return Math.sin(ph * 12.9898) * 0.9;
      default: return Math.sin(ph * Math.PI * 4) * 0.6;
    }
  }
  function drawLfo(cv, l) {
    if (!cv.isConnected) return;
    var w = cv.clientWidth || 280, h = cv.clientHeight || 30;
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    c.strokeStyle = '#241a3d'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
    var col = Math.round(S.patch['lfo' + l + '.uni']) ? '#c084fc' : '#a78bfa';
    var N = 120;
    c.beginPath();
    for (var i = 0; i <= N; i++) {
      var ph = (i / N + lfoPhase[l]) % 1;
      var v = lfoShape(l, ph) * 0.86;
      var y = h / 2 - v * (h / 2 - 3);
      var x = i / N * w;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.strokeStyle = col; c.lineWidth = 1.5; c.stroke();
    var vNow = lfoShape(l, lfoPhase[l]) * 0.86;
    c.beginPath(); c.arc(2, h / 2 - vNow * (h / 2 - 3), 2.6, 0, Math.PI * 2);
    c.fillStyle = '#e9d5ff'; c.fill();
  }

  function buildLfo(l, host) {
    var card = el('div', 'mod');
    var h = el('div', 'mod-h');
    var tag = el('span', 'tag', 'LFO' + (l + 1));
    tag.title = '拖到旋钮上建立调制';
    bindModDrag(tag, 'lfo' + (l + 1));
    h.appendChild(tag);
    h.appendChild(el('span', 'nm', '低频振荡 ' + (l + 1)));
    card.appendChild(h);
    var cv = el('canvas', 'ed');
    cv.style.height = '30px';
    card.appendChild(cv);
    (S.lfoCv = S.lfoCv || [])[l] = cv;
    var row = el('div', 'knobrow');
    makeKnob(row, 'lfo' + l + '.rate', { color: '#a78bfa', label: '速率' });
    makeKnob(row, 'lfo' + l + '.amp', { color: '#a78bfa', label: '幅度' });
    var selWrap = el('div');
    selWrap.style.cssText = 'width:78px;align-self:center';
    makeSelect(selWrap, 'lfo' + l + '.shape');
    row.appendChild(selWrap);

  /* --- 键盘 --- */
  var BASE = 48;
  var NAME = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  function isBlack(m) { var n = ((m % 12) + 12) % 12; return n === 1 || n === 3 || n === 6 || n === 8 || n === 10; }
  function noteName(m) { return NAME[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); }

  function buildKeyboard() {
    var kbd = $('kbd');
    kbd.innerHTML = '';
    var start = BASE + S.octave * 12;
    var notes = [];
    for (var i = 0; i < 27; i++) notes.push(start + i);
    var whites = notes.filter(function (m) { return !isBlack(m); });
    var w = 100 / whites.length;
    var wi = 0;
    whites.forEach(function (m) {
      var k = el('div', 'wkey');
      k.style.left = (wi * w) + '%';
      k.style.width = w + '%';
      k.dataset.midi = String(m);
      if (m % 12 === 0) k.textContent = noteName(m);
      kbd.appendChild(k);
      wi++;
    });
    notes.forEach(function (m) {
      if (!isBlack(m)) return;
      var idx = 0;
      for (var j = 0; j < whites.length; j++) if (whites[j] < m) idx = j + 1;
      var k = el('div', 'bkey');
      k.style.left = 'calc(' + (idx * w) + '% - ' + (w * 0.3) + '%)';
      k.style.width = (w * 0.6) + '%';
      k.dataset.midi = String(m);
      kbd.appendChild(k);
    });
    for (var h = 0; h < 27; h++) {
      var kk = keyEl(start + h);
      if (kk && S.held[start + h]) kk.classList.add('on');
    }
  }

  function keyEl(midi) {
    var kbd = $('kbd');
    return kbd ? kbd.querySelector('[data-midi="' + midi + '"]') : null;
  }

  function press(midi, vel) {
    if (S.held[midi]) return;
    S.held[midi] = true;
    var k = keyEl(midi);
    if (k) k.classList.add('on');
    ensureAudio();
    post({ type: 'note', on: 1, midi: midi, vel: vel === undefined ? 0.9 : vel });
  }
  function release(midi) {
    if (!S.held[midi]) return;
    delete S.held[midi];
    var k = keyEl(midi);
    if (k) k.classList.remove('on');
    if (S.hold) { S.sustained[midi] = true; return; }
    post({ type: 'note', on: 0, midi: midi });
  }
  function releaseAll() {
    for (var m in S.held) release(+m);
    for (var s in S.sustained) post({ type: 'note', on: 0, midi: +s });
    S.sustained = {};
    if (S.hold) { S.hold = false; updateHold(); }
  }
  function updateHold() {
    var b = $('holdBtn');
    b.textContent = '保持 ' + (S.hold ? 'ON' : 'OFF');
    b.style.color = S.hold ? '#4ade80' : '';
  }

  var ptr = null;
  function bindKeyboard() {
    var kbd = $('kbd');
    kbd.addEventListener('pointerdown', function (e) {
      var t = e.target.closest('.wkey,.bkey');
      if (!t) return;
      e.preventDefault();
      if (!S.ctx) ensureAudio();
      var midi = +t.dataset.midi;
      ptr = { id: e.pointerId, midi: midi };
      press(midi, 0.55 + Math.random() * 0.4);
    });
    window.addEventListener('pointermove', function (e) {
      if (!ptr || e.pointerId !== ptr.id) return;
      var t = document.elementFromPoint(e.clientX, e.clientY);
      var k = t && t.closest ? t.closest('.wkey,.bkey') : null;
      if (!k) return;
      var midi = +k.dataset.midi;
      if (midi !== ptr.midi) {
        release(ptr.midi);
        ptr.midi = midi;
        press(midi, 0.8);
      }
    });
    window.addEventListener('pointerup', function (e) {
      if (!ptr || e.pointerId !== ptr.id) return;
      release(ptr.midi);
      ptr = null;
    });
    window.addEventListener('pointercancel', function (e) {
      if (!ptr || e.pointerId !== ptr.id) return;
      release(ptr.midi);
      ptr = null;
    });
  }

  var KEYMAP = {
    KeyZ: 0, KeyS: 1, KeyX: 2, KeyD: 3, KeyC: 4, KeyV: 5, KeyG: 6, KeyB: 7, KeyH: 8, KeyN: 9, KeyJ: 10, KeyM: 11,
    KeyQ: 12, Digit2: 13, KeyW: 14, Digit3: 15, KeyE: 16, KeyR: 17, Digit5: 18, KeyT: 19, Digit6: 20, KeyY: 21, Digit7: 22, KeyU: 23,
    KeyI: 24, Digit9: 25, KeyO: 26
  };
  function bindComputerKeys() {
    window.addEventListener('keydown', function (e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (e.code === 'ArrowUp') { S.octave = clamp(S.octave + 1, -2, 2); buildKeyboard(); e.preventDefault(); return; }
      if (e.code === 'ArrowDown') { S.octave = clamp(S.octave - 1, -2, 2); buildKeyboard(); e.preventDefault(); return; }
      if (e.code === 'Space') { e.preventDefault(); releaseAll(); return; }
      var off = KEYMAP[e.code];
      if (off === undefined) return;
      e.preventDefault();
      if (e.repeat) return;
      press(BASE + S.octave * 12 + off, 0.9);
    });
    window.addEventListener('keyup', function (e) {
      var off = KEYMAP[e.code];
      if (off === undefined) return;
      release(BASE + S.octave * 12 + off);
    });
    window.addEventListener('blur', releaseAll);
  }

  /* --- MIDI（含 M-VAVE FM-1 控制器映射） --- */
  var FM1_ENC = { 20: 'flt.cut', 21: 'flt.res', 22: 'gen0.cut', 23: 'gen0.res', 24: 'macro.val', 25: 'voice.gain', 26: 'fx2.mix' };
  var FM1_BTN = ['上一个音色', '下一个音色', '静音', '保持', '初始化', '随机', '试听', '全局滤波', 'FX1', 'FX2', 'FX3', 'FX4', 'FX5', '—'];

  function fm1Encoder(cc, v) {
    var id = FM1_ENC[cc];
    if (!id || !P[id]) return;
    var d = P[id];
    var delta = v - 64;
    if (!delta) return;
    var n = PLANT.toNorm(d, S.patch[id]) + delta / 64 * 0.045;
    setParam(id, valueFromNorm(d, n));
  }

  function fm1Button(idx) {
    if (idx === 0) loadPreset(S.preset - 1);
    else if (idx === 1) loadPreset(S.preset + 1);
    else if (idx === 2) { releaseAll(); post({ type: 'panic' }); }
    else if (idx === 3) { S.hold = !S.hold; updateHold(); }
    else if (idx === 4) loadPreset(0);
    else if (idx === 5) randomPatch();
    else if (idx === 6) audition();
    else if (idx === 7) setParam('flt.on', Math.round(S.patch['flt.on']) ? 0 : 1);
    else if (idx >= 8 && idx <= 12) {
      var n = idx - 8;
      setParam('fx' + n + '.on', Math.round(S.patch['fx' + n + '.on']) ? 0 : 1);
    }
    if (idx < 13) toast('FM-1 · ' + FM1_BTN[idx]);
  }

  function handleMidi(d, isFM1) {
    var cmd = d[0] & 0xf0;
    if (cmd === 0x90 && d[2] > 0) { press(d[1], d[2] / 127); return; }
    if (cmd === 0x80 || (cmd === 0x90 && d[2] === 0)) { release(d[1]); return; }
    if (cmd === 0xb0) {
      var cc = d[1], v = d[2];
      if (cc === 1) { post({ type: 'mw', v: v / 127 }); return; }
      if (cc === 64) { if (v >= 64) { S.hold = true; updateHold(); } else { S.hold = false; updateHold(); } return; }
      if (isFM1) {
        if (cc >= 20 && cc <= 26) { fm1Encoder(cc, v); return; }
        if (cc >= 40 && cc <= 53) { if (v > 0) fm1Button(cc - 40); return; }
      }
      return;
    }
    if (cmd === 0xd0) { post({ type: 'at', v: d[1] / 127 }); return; }
    if (cmd === 0xe0) { post({ type: 'bend', v: ((d[2] << 7 | d[1]) - 8192) / 8192 }); return; }
  }

  function bindMidi() {
    if (!navigator.requestMIDIAccess) return;
    navigator.requestMIDIAccess().then(function (access) {
      function hook(input) {
        var isFM1 = /fm[-\s]?1|m[-\s]?vave/i.test(input.name || '');
        if (isFM1 && !S.device) {
          S.device = input.name;
          toast('FM-1 已连接，键盘和旋钮可用');
        }
        input.onmidimessage = function (msg) { handleMidi(msg.data, isFM1); };
      }
      access.inputs.forEach(hook);
      access.onstatechange = function (e) {
        if (e.port.type === 'input' && e.port.state === 'connected') hook(e.port);
      };
      var names = [];
      access.inputs.forEach(function (i) {
        names.push(i.name);
        if (/fm[-\s]?1|m[-\s]?vave/i.test(i.name || '')) S.device = i.name;
      });
      if (names.length) toast('MIDI 输入：' + names.join(' / '));
      if (S.device) toast('FM-1 已连接，键盘和旋钮可用');
    }).catch(function () { });
  }

  /* --- 拖拽调制 --- */
  function bindModDrag(tagEl, src) {
    tagEl.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var ghost = $('dropMod');
      var idx = PLANT.MOD_SOURCES.indexOf(src);
      ghost.textContent = (PLANT.MOD_LABELS[idx] || src).toUpperCase();
      ghost.style.display = 'block';
      document.body.classList.add('mod-dragging');
      document.querySelectorAll('.knob').forEach(function (k) { k.classList.add('target'); });
      function move(ev) {
        ghost.style.left = ev.clientX + 'px';
        ghost.style.top = ev.clientY + 'px';
      }
      function up(ev) {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        ghost.style.display = 'none';
        document.body.classList.remove('mod-dragging');
        document.querySelectorAll('.knob.target').forEach(function (k) { k.classList.remove('target'); });
        var el2 = document.elementFromPoint(ev.clientX, ev.clientY);
        var knobEl = el2 && el2.closest ? el2.closest('.knob') : null;
        if (knobEl && knobEl.dataset.param) addMod(src, knobEl.dataset.param);
        else toast('要拖到具体的旋钮上');
      }
      move(e);
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  }

  function addMod(src, target) {
    var d = P[target];
    if (!d || d.slot < 0) { toast('「' + (d ? d.label : target) + '」不可调制'); return; }
    var ex = S.mods.find(function (m) { return m.src === src && m.target === target; });
    if (ex) ex.amt = clamp(ex.amt + 0.3, -1, 1);
    else S.mods.push({ src: src, target: target, amt: 0.5 });
    sendMods();
    renderMatrix();
    var idx = PLANT.MOD_SOURCES.indexOf(src);
    toast((PLANT.MOD_LABELS[idx] || src) + ' → ' + d.label + (ex ? ' 加深' : ' 已接线'));
    saveSoon();
  }

        } catch (err) { toast('文件读取失败'); }
      };
      r.readAsText(f);
      e.target.value = '';
    });
    $('octUp').addEventListener('click', function () { S.octave = clamp(S.octave + 1, -2, 2); buildKeyboard(); });
    $('octDown').addEventListener('click', function () { S.octave = clamp(S.octave - 1, -2, 2); buildKeyboard(); });
    $('holdBtn').addEventListener('click', function () {
      S.hold = !S.hold;
      updateHold();
      if (!S.hold) {
        for (var m in S.sustained) post({ type: 'note', on: 0, midi: +m });
        S.sustained = {};
      }
    });
  }

  function act(a) {
    if (a === 'init') { loadPreset(0); toast('已初始化'); }
    else if (a === 'rand') { randomPatch(); }
    else if (a === 'audition') { audition(); }
    else if (a === 'save') { exportPatch(); }
    else if (a === 'load') { $('fileIn').click(); }
    else if (a === 'flash') { flash(); }
    else if (a === 'panic') { releaseAll(); post({ type: 'panic' }); toast('全部静音'); }
  }

  var auditionTimers = [];
  function audition() {
    ensureAudio();
    auditionTimers.forEach(clearTimeout);
    auditionTimers = [];
    var seq = [[0, 60], [0.22, 64], [0.44, 67], [0.66, 72], [0.88, 67]];
    seq.forEach(function (n) {
      auditionTimers.push(setTimeout(function () {
        var midi = BASE + S.octave * 12 + (n[1] - 60);
        press(midi, 0.92);
        auditionTimers.push(setTimeout(function () { release(midi); }, 800));
      }, n[0] * 1000));
    });
  }

  function exportPatch() {
    var p = PRESETS[S.preset] || { name: '用户音色', en: 'USER' };
    var data = { format: 'plant1', version: PLANT.version, name: p.name, en: p.en, params: S.patch, mods: S.mods };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'plant1-' + (p.en || 'user').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    toast('音色已导出');
  }

  var flashing = false;
  function flash() {
    if (flashing) return;
    flashing = true;
    ensureAudio();
    var steps = ['USB 握手…', '校验固件…', '写入引擎…', '写入音色…', '重启设备…'];
    var i = 0;
    var timer = setInterval(function () {
      $('sPreset').textContent = steps[i] || 'DONE';
      $('sPreset').style.color = '#fbbf24';
      i++;
      if (i > steps.length) {
        clearInterval(timer);
        $('sPreset').style.color = '';
        $('sPreset').textContent = (PRESETS[S.preset] || {}).en || 'USER';
        toast('已写入 FM-1 · 拔出 USB 后重启生效');
        flashing = false;
      }
    }, 220);
  }

  function randomPatch() {
    var rnd = function (a, b) { return a + Math.random() * (b - a); };
    var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
    var patch = PLANT.defaults();
    patch['voice.unison'] = Math.round(rnd(1, 4));
    patch['voice.detune'] = rnd(4, 40);
    patch['voice.spread'] = rnd(0.2, 1);
    patch['voice.gain'] = 0.85;
    patch['env0.a'] = rnd(0.001, 1.2);
    patch['env0.d'] = rnd(0.2, 2.5);
    patch['env0.s'] = rnd(0, 0.85);
    patch['env0.r'] = rnd(0.1, 2.2);
    var mods = [];
    var n = Math.random() < 0.5 ? 1 : 2;
    for (var i = 0; i < n; i++) {
      var t = pick([0, 0, 1, 2, 3]);
      patch['gen' + i + '.on'] = 1;
      patch['gen' + i + '.type'] = t;
      patch['gen' + i + '.level'] = 0;
      patch['gen' + i + '.pan'] = rnd(-0.6, 0.6);
      patch['gen' + i + '.tune'] = pick([-12, 0, 0, 12]);
      patch['gen' + i + '.cut'] = rnd(200, 12000);
      patch['gen' + i + '.res'] = rnd(0, 0.6);
      patch['gen' + i + '.ftype'] = Math.random() < 0.7 ? 1 : 0;
      patch['gen' + i + '.wave'] = Math.floor(rnd(0, 4));
      patch['gen' + i + '.pwm'] = rnd(0.2, 0.8);
      patch['gen' + i + '.table'] = Math.floor(rnd(0, 6));
      patch['gen' + i + '.morph'] = rnd(0, 1);
      patch['gen' + i + '.ratio'] = pick([0.5, 1, 1.5, 2, 3, 3.5, 5, 7]);
      patch['gen' + i + '.index'] = rnd(0, 6);
      patch['gen' + i + '.color'] = rnd(0, 1);
      mods.push({ src: 'env1', target: 'gen' + i + '.level', amt: rnd(0.5, 0.95) });
    }
    if (Math.random() < 0.6) mods.push({ src: 'env2', target: 'gen0.cut', amt: rnd(0.1, 0.5) });
    if (Math.random() < 0.5) mods.push({ src: pick(['lfo1', 'lfo2']), target: 'gen1.pan', amt: rnd(0.1, 0.5) });
    if (Math.random() < 0.5) mods.push({ src: 'chaos', target: 'gen0.pwm', amt: rnd(0.05, 0.3) });
    patch['lfo0.rate'] = rnd(0.05, 1.5);
    patch['lfo1.rate'] = rnd(0.05, 1.5);
    patch['flt.on'] = Math.random() < 0.5 ? 1 : 0;
    patch['flt.cut'] = rnd(500, 9000);
    patch['flt.res'] = rnd(0, 0.4);
    patch['env1.a'] = rnd(0.001, 1);
    patch['env1.d'] = rnd(0.1, 1.5);
    patch['env1.s'] = rnd(0, 0.7);
    patch['env2.a'] = rnd(0.001, 0.6);
    patch['env2.d'] = rnd(0.05, 0.8);
    patch['env2.s'] = rnd(0, 0.4);
    var fxs = [4, 5, 2, 0, 1];
    for (var f = 0; f < 3; f++) {
      patch['fx' + f + '.on'] = 1;
      patch['fx' + f + '.type'] = fxs[f];
      patch['fx' + f + '.p1'] = rnd(0.2, 0.8);
      patch['fx' + f + '.p2'] = rnd(0.2, 0.7);
      patch['fx' + f + '.p3'] = rnd(0.2, 0.7);
      patch['fx' + f + '.mix'] = rnd(0.1, 0.4);
    }
    S.patch = patch;
    S.mods = mods;
    S.patch.mods = mods;
    S.preset = -1;
    applyPatchUI();
    sendPatch();
    toast('随机音色已生成');
  }

  /* --- 顶栏动画 --- */
  function loop(now) {
    var dt = (now - (loop.last || now)) / 1000;
    loop.last = now;
    for (var l = 0; l < 2; l++) {
      lfoPhase[l] = (lfoPhase[l] + dt * lfoRate(l)) % 1;
      if (S.lfoCv && S.lfoCv[l]) drawLfo(S.lfoCv[l], l);
    }
    drawScope();
    if (S.meterBar) {
      var m = clamp(S.meter * 2.6, 0, 1);
      S.meterBar.style.width = (m * 100).toFixed(1) + '%';
    }
    $('sVoices').textContent = S.ready ? ((S.device ? 'FM-1 · ' : '') + S.voices + ' V') : '点击开启';
    requestAnimationFrame(loop);
  }

  function drawScope() {
    var cv = $('scope');
    var c = cv.getContext('2d');
    var w = cv.width, h = cv.height;
    c.clearRect(0, 0, w, h);
    c.strokeStyle = 'rgba(74,222,128,.16)';
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
    c.strokeStyle = '#4ade80';
    c.lineWidth = 2;
    c.beginPath();
    if (S.analyser) {
      if (!S.scopeBuf || S.scopeBuf.length !== S.analyser.fftSize) S.scopeBuf = new Float32Array(S.analyser.fftSize);
      var buf = S.scopeBuf;
      S.analyser.getFloatTimeDomainData(buf);
      for (var i = 0; i < w; i++) {
        var v = buf[Math.floor(i / w * buf.length)] * 1.4;
        var y = h / 2 - clamp(v, -1, 1) * (h / 2 - 3);
        if (i === 0) c.moveTo(i, y); else c.lineTo(i, y);
      }
    } else {
      c.moveTo(0, h / 2); c.lineTo(w, h / 2);
    }
    c.stroke();
  }

  /* --- 自检 API --- */
  window.PLANT1 = {
    version: PLANT.version,
    params: Object.keys(P).length,
    patch: function () { return JSON.parse(JSON.stringify({ params: S.patch, mods: S.mods })); },
    presets: PRESETS.map(function (p) { return p.name; }),
    addMod: addMod,
    setParam: setParam,
    press: press,
    release: release,
    status: function () {
      return {
        ready: S.ready,
        state: S.ctx ? S.ctx.state : null,
        mode: S.node ? (S.node.local ? 'script' : 'worklet') : null,
        voices: S.voices,
        meter: S.meter
      };
    },
    offline: function (presetIndex, seconds, midi) {
      var e = new PLANT.Engine(48000);
      var p = PRESETS[presetIndex];
      var patch = Object.assign(PLANT.defaults(), p.params, { mods: p.mods || [] });
      e.setPatch(patch);
      var t0 = performance.now();
      var res = e.renderOffline(seconds || 2, [{ t: 0.02, on: true, midi: midi || 60, vel: 0.9 }]);
      var L = res[0], R = res[1];
      var peak = 0, sum = 0, nan = 0;
      for (var i = 0; i < L.length; i++) {
        var a = Math.max(Math.abs(L[i]), Math.abs(R[i]));
        if (!isFinite(L[i]) || !isFinite(R[i])) nan++;
        if (a > peak) peak = a;
        sum += L[i] * L[i] + R[i] * R[i];
      }
      return { name: p.name, peak: peak, rms: Math.sqrt(sum / (L.length * 2)), nan: nan, ms: performance.now() - t0 };
    }
  };

  /* --- 启动 --- */
  buildVoice();
  buildFilter();
  buildGens();
  buildMods();
  buildFx();
  buildKeyboard();
  bindHeader();
  bindKeyboard();
  bindComputerKeys();
  bindMidi();
  renderMatrix();

  if (loadLocal()) {
    applyPatchUI();
    toast('已恢复上次的音色');
  } else {
    loadPreset(0, true);
  }
  updateHold();
  requestAnimationFrame(loop);

  window.addEventListener('resize', function () { refreshAllKnobs(); });
  ['pointerdown', 'keydown'].forEach(function (ev) {
    var once = function () { ensureAudio(); window.removeEventListener(ev, once); };
    window.addEventListener(ev, once);
  });
})();
</script>
</body>
